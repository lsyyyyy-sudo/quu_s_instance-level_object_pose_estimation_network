# 数据模块配置：读取 BOP 格式的合成渲染数据（由 HCCEPose 的 BlenderProc 脚本产出）
# 对应 BoxDreamer/configs/datamodule/local.yaml
_target_: src.datamodules.corner_pose_datamodule.CornerPoseDataModule

# 数据集根目录，结构需为：
#   <dataset_root>/models/models_info.json
#   <dataset_root>/train_pbr/000000/{rgb,scene_gt.json,scene_camera.json,...}
dataset_root: ${hydra:runtime.cwd}/data/dji_action4

train_split: train_pbr
val_split: train_pbr
val_ratio: 0.05          # 从 train 里切一小部分做验证

obj_ids: [1]             # 目标物体 id（BOP 里对应 models/obj_000001.ply）
batch_size: 16
num_workers: 4
pin_memory: true

# 分辨率与热图
image_size: ${image_size}
heatmap_size: ${heatmap_size}
heatmap_style: ${heatmap_style}   # 与 model 共用根配置的同一个键
sigma: 2.0               # 固定高斯标准差，仅 heatmap_style='centernet' 时生效

# 裁剪：按物体 2D 包围框外扩，模拟检测器给出的框
crop_scale: 1.4          # 外扩系数
use_gt_crop: true        # true 用 GT 框裁剪（训练用），false 用整图（更接近真实）

# 数据增强（模拟真实视频的域差异）
augment: true
aug_color_jitter: 0.3
aug_blur_prob: 0.3
aug_noise_std: 0.02
aug_random_crop_jitter: 0.1

# 调试用：限制样本数（null = 不限制）
max_train_samples: null
max_val_samples: 512
shuffle_train: true

# 可见性过滤（⚠️ 重要）
# 裁剪是按 bbox_visib 做的。实例如果几乎/完全被挡住，那个框会退化成 0 大小，
# 裁出来是一块无关背景却配着"正确"的角点标签 —— 纯噪声样本。
# 料箱堆叠后这类实例占比很高（实测 25%），必须滤掉。
# 判据来自 scene_gt_info.json 的 px_count_visib / visib_fract。
min_px_visib: 64        # 可见像素数下限
min_visib_fract: 0.10   # 可见面积占比下限

# ============================================================
#  BoxDreamer 式训练时增强（**打的是我们实测出的两个失败模式**）
# ============================================================
# 为什么需要（见 docs/RESULTS.md）：
#   · 遮挡：完全可见样本角点失败率 0.79%，严重遮挡样本 45.0%（差 57 倍）
#   · 跨域：合成数据中位误差 1.44 px，真实视频上角点明显跑偏
# 而训练集里几乎没遮挡（95% 完全可见）、也没有真实相机的光度特性。
# 参数与 refs/BoxDreamer/configs/datamodule/local.yaml 对齐。
#
# 目标物体 bbox 内被"挖掉"的比例区间；null = 关闭
obj_mask_ratio: [0.0, 0.4]
# 把一个**兄弟实例**贴到目标上的概率（模拟物体互相遮挡）
obj_paste_prob: 0.4
# 光度增强：'dark' 模拟暗光，'mobile' 模拟手机相机（运动模糊/色彩抖动/ISO 噪声）
rgb_augmethods: ['dark', 'mobile']
